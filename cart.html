<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | Veloura</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      background: #faf9f7;
      color: #242220;
      line-height: 1.8;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .nav {
      max-width: 900px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
    }

    .back {
      color: #666;
      font-size: 14px;
      text-decoration: none;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 50px 20px 80px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 30px;
    }

    .cart-box {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 25px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 700;
    }

    .product-price {
      margin-top: 8px;
      color: #666;
    }

    .total {
      border-top: 1px solid #eee;
      margin-top: 25px;
      padding-top: 20px;
      font-size: 20px;
      font-weight: 700;
    }

    .button {
      display: block;
      background: #242220;
      color: #fff;
      text-align: center;
      padding: 13px;
      border-radius: 10px;
      margin-top: 20px;
      text-decoration: none;
    }

    footer {
      background: #242220;
      color: #fff;
      text-align: center;
      padding: 35px 20px;
    }

    footer p {
      color: #bbb;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <nav class="nav">
      <a href="index.html" class="logo">Veloura.</a>
      <a href="products.html" class="back">← محصولات</a>
    </nav>
  </header>

  <main>
    <h1>سبد خرید</h1>

    <div class="cart-box">
      <div class="product-name">ست پاییزه میو میو</div>
<div class="product-price">۱,۴۴۰,۰۰۰ تومان</div>

<div class="quantity">
  <button onclick="decreaseQuantity()">−</button>
  <span id="quantity">1</span>
  <button onclick="increaseQuantity()">+</button>
</div>

      <div class="total">
        مجموع: ۱,۴۴۰,۰۰۰ تومان
      </div>

      <a href="products.html" class="button">ادامه خرید</a>
    </div>
  </main>

  <footer>
    <h2>Veloura.</h2>
    <p>فروشگاهی برای انتخاب‌های خاص، ساده و زیبا.</p>
  </footer>
<script>
  let quantity = 1;

  function increaseQuantity() {
    quantity++;
    document.getElementById("quantity").textContent = quantity;
  }

  function decreaseQuantity() {
    if (quantity > 1) {
      quantity--;
      document.getElementById("quantity").textContent = quantity;
    }
  }
</script>

</body>
</html>
