<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | Veloura</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      background: #faf9f7;
      color: #242220;
      line-height: 1.8;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .nav {
      max-width: 900px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
  display: flex;
  align-items: center;
}

.logo img {
  width: 95px;
  height: auto;
  display: block;
}

    .back {
      color: #666;
      font-size: 14px;
      text-decoration: none;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 50px 20px 80px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 30px;
    }

    .cart-box {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 25px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 700;
    }

    .product-price {
      margin-top: 8px;
      color: #666;
    }

    .total {
      border-top: 1px solid #eee;
      margin-top: 25px;
      padding-top: 20px;
      font-size: 20px;
      font-weight: 700;
    }

    .button {
      display: block;
      background: #242220;
      color: #fff;
      text-align: center;
      padding: 13px;
      border-radius: 10px;
      margin-top: 20px;
      text-decoration: none;
    }

    footer {
      background: #242220;
      color: #fff;
      text-align: center;
      padding: 35px 20px;
    }

    footer p {
      color: #bbb;
      font-size: 13px;
    }
    .cart-product-image {
  width: 140px;
  height: 140px;
  object-fit: contain;
  display: block;
  margin: 0 auto 15px;
  border-radius: 12px;
  background: #f0eeeb;
}

.cart-box .product-name {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
}

.cart-box .product-price {
  font-size: 16px;
  color: #777;
}
.cart-box {
  text-align: center;
  padding: 30px;
  box-shadow: 0 8px 25px rgba(0,0,0,.05);
}
.quantity {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-top: 20px;
}

.quantity button {
  width: 38px;
  height: 38px;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
}

.quantity span {
  font-size: 18px;
  font-weight: 700;
  min-width: 25px;
}
.remove-button {
  margin-top: 18px;
  padding: 9px 18px;
  border: 1px solid #ddd;
  background: #fff;
  color: #777;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
}
.total {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #eee;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: .3px;
}

.total span {
  font-size: 23px;
}
.cart-box .button {
  margin-top: 22px;
  padding: 13px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  transition: opacity .2s;
}

.cart-box .button:hover {
  opacity: .85;
}
</style>
</head>

<body>

  <header>
    <nav class="nav">
      <a href="index.html" class="logo">
  <img src="veloura-logo.jpg" alt="Veloura">
</a>
      <a href="products.html" class="back">← محصولات</a>
    </nav>
  </header>

  <main>
    <h1>سبد خرید</h1>
<div id="emptyCart" style="display:none; text-align:center; padding:40px 20px;">
  <h2>سبد خرید شما خالی است 🛒</h2>
  <p style="color:#777; margin-top:10px;">هنوز محصولی به سبد خرید اضافه نکرده‌اید.</p>
  <a href="products.html" class="button" style="max-width:250px; margin:20px auto 0;">
    مشاهده محصولات
  </a>
</div>
    <div class="cart-box">
      <img id="cartProductImage" src="dress.jpg" alt="ست پاییزه میو میو" class="cart-product-image">
<div class="product-name" id="cartProductName">ست پاییزه میو میو</div>
<div class="product-price" id="cartProductPrice">۱,۸۰۰,۰۰۰ تومان</div>
<div class="product-size" id="cartProductSize"></div>
<div class="quantity">
  <button onclick="decreaseQuantity()">−</button>
  <span id="quantity">1</span>
  <button onclick="increaseQuantity()">+</button>
</div>

<button class="remove-button" onclick="removeProduct()">حذف محصول 🗑️</button>

<div class="total">
  مجموع: <span id="totalPrice">۱,۸۰۰,۰۰۰</span> تومان
</div>
      <a href="products.html" class="button">ادامه خرید</a>
<a href="checkout.html" class="button">ادامه و ثبت سفارش</a>
    </div>
  </main>

  <footer>
    <h2>Veloura.</h2>
    <p>فروشگاهی برای انتخاب‌های خاص، ساده و زیبا.</p>
  </footer>
<script>
  let quantity = 1;
const price = 1800000;

function updateCart() {
  document.getElementById("quantity").textContent = quantity;
  document.getElementById("totalPrice").textContent =
    (price * quantity).toLocaleString("fa-IR");
}

function increaseQuantity() {
  quantity++;
  updateCart();
}

function decreaseQuantity() {
  if (quantity > 1) {
    quantity--;
    updateCart();
  }
}

function removeProduct() {
  localStorage.removeItem("velouraCart");

  document.querySelector(".product-name").style.display = "none";
  document.querySelector(".product-price").style.display = "none";
  document.querySelector(".quantity").style.display = "none";
  document.querySelector(".remove-button").style.display = "none";
  document.querySelector(".total").style.display = "none";
}

window.onload = function() {
  const cart = localStorage.getItem("velouraCart");

  if (!cart) {
    document.querySelector(".product-name").style.display = "none";
    document.querySelector(".product-price").style.display = "none";
    document.querySelector(".quantity").style.display = "none";
    document.querySelector(".remove-button").style.display = "none";
    document.querySelector(".total").style.display = "none";
    document.getElementById("emptyCart").style.display = "block";
    return;
  }

  const product = JSON.parse(cart);

  document.getElementById("cartProductImage").src = product.image;
document.getElementById("cartProductImage").alt = product.name;
document.getElementById("cartProductName").textContent = product.name;
document.getElementById("cartProductPrice").textContent =
  product.price.toLocaleString("fa-IR") + " تومان";
  document.getElementById("cartProductSize").textContent =
  "سایز: " + product.size;
</script>
</body>
</html>
