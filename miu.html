<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ست پاییزه میو میو | Veloura</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      background: #faf9f7;
      color: #242220;
      line-height: 1.8;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .nav {
      max-width: 900px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 25px;
      font-weight: 700;
    }
    .back {
      font-size: 14px;
      color: #666;
    }
    .product-page {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px 70px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: center;
    }
    .product-photo {
      height: 500px;
      background: #f0eeeb;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .product-photo img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }
    .tag {
      font-size: 12px;
      color: #888;
    }
    h1 {
      font-size: 34px;
      margin: 10px 0;
    }
    .description {
      color: #777;
      margin-bottom: 20px;
    }
    .price {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 25px;
    }
    .old-price {
      font-size: 14px;
      color: #aaa;
      text-decoration: line-through;
      margin-right: 10px;
      font-weight: normal;
    }
    .button {
      display: block;
      background: #242220;
      color: #fff;
      text-align: center;
      padding: 13px;
      border-radius: 10px;
      margin-top: 12px;
    }
    footer {
      background: #242220;
      color: #fff;
      text-align: center;
      padding: 35px 20px;
    }
    footer p {
      color: #bbb;
      font-size: 13px;
    }
    @media (max-width: 700px) {
      .product-page {
        grid-template-columns: 1fr;
        gap: 25px;
      }
      .product-photo {
        height: 380px;
      }
      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a href="index.html" class="logo">Veloura.</a>
      <a href="products.html" class="back">← بازگشت به محصولات</a>
    </nav>
  </header>
  <main class="product-page">
    <div class="product-photo">
      <img src="dress.jpg" alt="ست پاییزه میو میو">
    </div>
    <div class="product-info">
      <span class="tag">لباس کودک</span>
      <h1>ست پاییزه میو میو</h1>
      <p class="description">
        دورس ۱۰۰٪ نخ پنبه • قواره لش
      </p>
      <div class="price">
        ۱,۴۴۰,۰۰۰ تومان
        <span class="old-price">۱,۸۰۰,۰۰۰</span>
      </div>
      <a href="#" class="button">افزودن به سبد خرید</a>
    </div>
  </main>
  <footer>
    <h2>Veloura.</h2>
    <p>فروشگاهی برای انتخاب‌های خاص، ساده و زیبا.</p>
  </footer>
<script>
  document.querySelector('.button').addEventListener('click', function(event) {
    event.preventDefault();
    alert('محصول به سبد خرید اضافه شد 🛒');
  });
</script>
</body>
</html>
