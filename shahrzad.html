<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدل شهرزاد | Veloura</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      background: #faf9f7;
      color: #242220;
      line-height: 1.8;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .nav {
      max-width: 900px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
  display: flex;
  align-items: center;
}

.logo img {
  width: 95px;
  height: auto;
  display: block;
}
    .back {
      font-size: 14px;
      color: #666;
    }
    .product-page {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px 70px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: center;
    }
    .product-photo {
  height: 500px;
  background: #fff;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.06);
  border: 1px solid #eee;
}
    .product-photo img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }
    .tag {
      font-size: 12px;
      color: #888;
    }
    h1 {
  font-size: 36px;
  font-weight: 800;
  margin: 10px 0 14px;
  letter-spacing: -0.5px;
}

.description {
  color: #777;
  font-size: 15px;
  line-height: 2;
  margin-bottom: 22px;
}

.price {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 25px;
  letter-spacing: -0.3px;
}
    .old-price {
  font-size: 13px;
  color: #aaa;
  text-decoration: line-through;
  margin-right: 12px;
  font-weight: 400;
  opacity: .8;
}
    
    .button {
  display: block;
  background: #242220;
  color: #fff;
  text-align: center;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 15px;
  font-weight: 700;
  transition: opacity .2s, transform .2s;
}

.button:hover {
  opacity: .9;
  transform: translateY(-2px);
}
    footer {
      background: #242220;
      color: #fff;
      text-align: center;
      padding: 35px 20px;
    }
    footer p {
      color: #bbb;
      font-size: 13px;
    }
    @media (max-width: 700px) {
      .product-page {
        grid-template-columns: 1fr;
        gap: 25px;
      }
      .product-photo {
        height: 380px;
      }
      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a href="index.html" class="logo">
  <img src="veloura-logo.jpg" alt="Veloura">
</a>
      <a href="products.html" class="back">← بازگشت به محصولات</a>
    </nav>
  </header>
  <main class="product-page">
    <div class="product-photo">
      <img src="shahrzad.JPG" alt="مدل شهرزاد">
    </div>
    <div class="product-info">
      <span class="tag">لباس</span>
      <h1>مدل شهرزاد</h1>
      <p class="description">
  ست سه‌تکه شامل رویه، شلوار و تاپ
  • شلوار دو نخ پنبه لاکرا‌دار
  • تاپ فان‌ریپ پنبه
  • سه رنگ: نوک‌مدادی، سرمه‌ای، قهوه‌ای
  • سایزها: ۵۵، ۶۰، ۶۵، ۷۰
</p>
    <div class="price">
  ۲,۳۵۰,۰۰۰ تومان
</div>

<label for="size">انتخاب سایز:</label>
<select id="size">
  <option value="">سایز را انتخاب کنید</option>
  <option value="۵۵">۵۵</option>
  <option value="۶۰">۶۰</option>
  <option value="۶۵">۶۵</option>
  <option value="۷۰">۷۰</option>
</select>

<a href="#" class="button">افزودن به سبد خرید</a>
    </div>
  </main>
  <footer>
    <h2>Veloura.</h2>
    <p>فروشگاهی برای انتخاب‌های خاص، ساده و زیبا.</p>
  </footer>
<script>
  document.querySelector('.button').addEventListener('click', function(event) {
    event.preventDefault();

    const size = document.getElementById('size').value;

if (!size) {
  alert('لطفاً سایز را انتخاب کنید 👕');
  return;
}

const product = {
  name: 'ست شهرزاد',
  price: 2350000,
  image: 'shahrzad.JPG',
  size: size,
  quantity: 1
};
    localStorage.setItem('velouraCart', JSON.stringify(product));

    alert('محصول به سبد خرید اضافه شد 🛒');

    window.location.href = 'cart.html';
  });
</script>
</body>
</html>
