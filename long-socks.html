<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساق بلند | Veloura</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f6f3;
      color: #242220;
      line-height: 1.8;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: #fff;
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .page {
      max-width: 1000px;
      margin: 50px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
    }

    .description {
      margin-bottom: 35px;
      color: #666;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .product {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 18px;
      padding: 35px 20px;
    }

    .product h2 {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .product p {
      color: #666;
    }

    @media (max-width: 600px) {
      .products {
        grid-template-columns: 1fr;
      }

      .nav-links {
        gap: 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <div class="nav-links">
      <a href="index.html">خانه</a>
      <a href="products.html">محصولات</a>
      <a href="about.html">درباره ما</a>
    </div>

    <strong>Veloura</strong>
  </nav>
</header>

<main class="page">

  <h1>ساق بلند 🧦</h1>

  <p class="description">
    مجموعه جوراب‌های ساق بلند Veloura
  </p>

  <div class="products">

    <div class="product">
      <h2>جوراب ساق بلند</h2>
      <p>به‌زودی محصولات این دسته اضافه می‌شوند.</p>
    </div>

  </div>

</main>

</body>
</html>
